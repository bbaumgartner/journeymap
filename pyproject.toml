[project]
name = "journeymap"
version = "0.1.0"
description = "Render an animated journey-map MP4 from Logseq journals or a positions JSON file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pyvista>=0.48.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
journeymap = "journeymap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journeymap"]

[tool.hatch.build.targets.wheel.force-include]
"src/journeymap/assets" = "journeymap/assets"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
